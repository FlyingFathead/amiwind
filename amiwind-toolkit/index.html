<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AmiWind Toolkit</title>
<style>
:root{--bg:#101923;--panel:#162433;--ink:#edf3fa;--muted:#9fb3c8;--line:#345;--accent:#ffe28a}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
header img{height:46px;width:auto}
header h1{font-size:24px;margin:0 6px 0 -4px;font-weight:700;color:#e8c46a;letter-spacing:.5px;line-height:1.1}
header h1 small{display:block;font-size:11px;font-weight:400;color:var(--muted);letter-spacing:0}
nav{display:flex;gap:6px}
nav button{background:#203346;color:var(--ink);border:1px solid #456;border-radius:6px;padding:8px 14px;font-size:14px;cursor:pointer}
nav button[aria-selected="true"]{background:#2e4a66;border-color:var(--accent);color:var(--accent)}
.note{margin-left:auto;display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border:1px solid #6f8193;border-radius:50%;color:#8a9bad;font-size:12px;font-weight:700;cursor:help;user-select:none;flex:0 0 auto}
.note:hover,.note:focus{color:var(--text,#edf3fa);border-color:#9fb3c8}
#chimhead{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;padding:6px 16px;border-bottom:1px solid var(--line);background:#13202d}
#chimhead[hidden]{display:none}
#chimhead .chimtitle{font-size:17px;color:var(--ink);white-space:nowrap}
#chimhead .chimtitle b{color:#46c37b}
#chimhead .chimparts{display:flex;flex-wrap:wrap;gap:4px 8px}
#chimhead button{background:#203346;color:var(--ink);border:1px solid #456;border-radius:5px;padding:3px 8px;font-size:12px;cursor:pointer}
#chimhead button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
#chimhead button i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
#chimhead .chimnote,#chimhead .chimhist{color:var(--muted);font-size:12px}
#chimhead .chimhist svg{vertical-align:middle}
main{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none}
iframe.active{display:block}
</style>
</head>
<body>
<header>
  <img src="../resources/media/AmiWind_logo_name_only.png" alt="AmiWind">
  <h1>Toolkit<small id="toolkit-version" title="Set by hand when the Toolkit is next updated">Last updated with AmiWind v0.0.57</small></h1>
  <nav role="tablist">
    <button role="tab" id="tab-world" aria-selected="true">World</button>
    <button role="tab" id="tab-local" aria-selected="false">Local</button>
    <button role="tab" id="tab-inspector" aria-selected="false">3D Inspector</button>
    <button role="tab" id="tab-monitor" aria-selected="false">Monitor</button>
    <button role="tab" id="tab-meshes" aria-selected="false">Mesh Compare</button>
  </nav>
  <span class="note" title="Everything here runs in your browser. Views of the world are made from your own Morrowind files and build output on your machine; nothing is uploaded." aria-label="Everything here runs in your browser. Views of the world are made from your own Morrowind files and build output on your machine; nothing is uploaded." tabindex="0">?</span>
</header>
<div id="chimhead" hidden aria-label="CHIM Progress Tracker headline"></div>
<main>
  <iframe id="world" class="active" title="World and Local maps"></iframe>
  <iframe id="inspector" title="3D Map Inspector"></iframe>
  <iframe id="monitor" title="Monitor: follow a build"></iframe>
  <iframe id="meshes" title="Mesh Compare: two meshes side by side"></iframe>
</main>
<script src="chim-head.js"></script>
<script>
// World / Local, like the game's map menu, both in world-map.html; the 3D Map
// Inspector has its own tab and full-size frame, loaded on first use. "Show in
// 3D" in the Local view hands its map file here and switches to the inspector. The Monitor (a build as it runs,
// read-only) and Mesh Compare (two .OBJ files side by side) are their own tabs too, loaded on first use.
const frame = document.getElementById('world'), inspector = document.getElementById('inspector'),
  monitorFrame = document.getElementById('monitor'), meshFrame = document.getElementById('meshes');
frame.src = 'world-map.html' + location.search;  // ?served=1 from tools/toolkit_serve.py
let inspectorReady = false, inspectorQueue = null, lastChim = null;
function mark(m) {
  for (const t of ['world', 'local', 'inspector', 'monitor', 'meshes'])
    document.getElementById('tab-' + t).setAttribute('aria-selected', m === t ? 'true' : 'false');
  frame.classList.toggle('active', m !== 'inspector' && m !== 'monitor' && m !== 'meshes');
  inspector.classList.toggle('active', m === 'inspector');
  monitorFrame.classList.toggle('active', m === 'monitor');
  meshFrame.classList.toggle('active', m === 'meshes');
  // the tab in the address (#monitor ...), so a reload opens it again instead of the World tab (TOOLKIT-RELOAD-WORLD-55)
  if (location.hash !== '#' + m) history.replaceState(null, '', location.pathname + location.search + '#' + m);
}
function showInspector(file) {
  if (file) inspectorQueue = file;
  mark('inspector');
  if (!inspector.src) {
    inspector.onload = () => { inspectorReady = true; send(); };
    const args=new URLSearchParams(location.search),link=new URLSearchParams();
    for(const key of ['worldzip','world','map','maps','frame'])if(args.has(key))link.set(key,args.get(key));
    inspector.src = 'map-inspector.html'+(link.size?'?'+link.toString():'');
  } else send();
}
function send() {
  if (inspectorReady && inspectorQueue) {
    inspector.contentWindow.postMessage({type: 'amiwind-open-map', file: inspectorQueue}, '*');
    inspectorQueue = null;
  }
}
document.getElementById('tab-world').onclick = () => { mark('world'); frame.contentWindow.postMessage({type: 'amiwind-set-mode', mode: 'world'}, '*'); };
document.getElementById('tab-local').onclick = () => { mark('local'); frame.contentWindow.postMessage({type: 'amiwind-set-mode', mode: 'local'}, '*'); };
document.getElementById('tab-inspector').onclick = () => showInspector(null);
document.getElementById('tab-monitor').onclick = () => { mark('monitor'); if (!monitorFrame.src) monitorFrame.src = 'monitor.html' + location.search; };
document.getElementById('tab-meshes').onclick = () => { mark('meshes'); if (!meshFrame.src) meshFrame.src = 'mesh-compare.html'; };
// CHIM Progress Tracker headline: the World Map page sends its numbers; a click on one asks it to highlight those cells.
let chimPicked = null;
function chimHead(m) {
  const pick = bucket => {
    chimPicked = chimPicked === bucket ? null : bucket;
    mark('world');
    frame.contentWindow.postMessage({type: 'amiwind-set-mode', mode: 'world'}, '*');
    frame.contentWindow.postMessage({type: 'amiwind-chim-pick', bucket: chimPicked}, '*');
    chimHead(m);
  };
  window.ChimHead.render(document.getElementById('chimhead'), m.headline, m.history, pick, chimPicked);
}
window.addEventListener('message', e => {
  if (e.source !== frame.contentWindow || !e.data) return;
  if (e.data.type === 'amiwind-chim-head') { lastChim = e.data; chimHead(e.data); return; }
  if (e.data.type === 'amiwind-mode' && !inspector.classList.contains('active') && !monitorFrame.classList.contains('active') &&
      !meshFrame.classList.contains('active')) mark(e.data.mode);
  if (e.data.type === 'amiwind-open-inspector' && e.data.file instanceof File) showInspector(e.data.file);
});
if(!new URLSearchParams(location.search).has('cell') && ['worldzip','world','map'].some(k=>new URLSearchParams(location.search).has(k)))showInspector(null);
// a reload reopens the tab named in the address; Local waits for the map page, which takes its mode by message
{
  const start = location.hash.slice(1), tab = document.getElementById('tab-' + start);
  if (tab && start !== 'world' && !inspector.classList.contains('active')) {
    if (start === 'local') frame.addEventListener('load', () => tab.click(), {once: true}); else tab.click();
  }
}
</script>
</body>
</html>
