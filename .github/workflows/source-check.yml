name: Source checks and asset-free Amiga build

on:
  push:
    paths-ignore:
      - '**/*.md'
      - 'docs/images/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/images/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-launcher-parity:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install synthetic asset-test dependencies
        run: python -m pip install numpy Pillow
      - name: Shared host contract and real Windows launcher checks
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $env:PYTHONPATH = "${{ github.workspace }}/src" + [IO.Path]::PathSeparator + "${{ github.workspace }}/tools"
          python -B -m unittest discover -s tests -p test_build_host.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tests -p "test_build_windows*.py" -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tests -p test_setup_windows.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B -m unittest discover -s tests -p test_host_asset_formats.py -v
          exit $LASTEXITCODE

  source-and-dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}/tools
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Bootstrap all public tools into an empty directory
        run: |
          test ! -e "$RUNNER_TEMP/amiwind-clean-tools"
          python tools/build.py --autoinstall --install-dependencies --yes --tools-dir "$RUNNER_TEMP/amiwind-clean-tools"
          echo "$RUNNER_TEMP/amiwind-clean-tools/venv/bin" >> "$GITHUB_PATH"
          echo "QCC_PATH=$RUNNER_TEMP/amiwind-clean-tools/Quake-Tools/qcc-host" >> "$GITHUB_ENV"
          echo "AMIWIND_TEST_QBSP=$RUNNER_TEMP/amiwind-clean-tools/ericw/bin/qbsp" >> "$GITHUB_ENV"
      - name: Source allowlist and synthetic regression checks
        run: |
          python tools/release.py --check
          python -c 'from prepare_scenery import check_nif_reader; check_nif_reader()'
          python -m unittest discover -s tests -v
          python tools/build.py --install-dependencies --plan
      - name: Compile the engine and create a boot-notice image
        run: python tools/build.py --dry-run --tools-dir "$RUNNER_TEMP/amiwind-clean-tools" --name ci
      - name: Package the test image and corresponding source
        run: python tools/package_dry_run.py --image-dir out/build/ci/image --out out/artifacts
      - name: Name the public artifact
        id: artifact
        run: |
          python - <<'PY'
          import os
          from build_aga import VERSION
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'name=AmiWind-v{VERSION}-dry-run\n')
          PY
      - name: Upload only the asset-free package and checksum
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            out/artifacts/AmiWind-*-dry-run.zip
            out/artifacts/AmiWind-*-dry-run.zip.sha256
          if-no-files-found: error
          retention-days: 14

  docker-builder:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Build tools-only image and validate the Linux container builder
        run: >-
          python tools/build_docker.py check
          --context "${{ runner.temp }}/amiwind-docker-context"
          --output "${{ runner.temp }}/amiwind-docker-results"
          --volume amiwind-ci-builds
      - name: Retain Docker diagnostics on success or failure
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AmiWind-Docker-builder-diagnostics
          path: ${{ runner.temp }}/amiwind-docker-results/
          if-no-files-found: warn
          retention-days: 14
