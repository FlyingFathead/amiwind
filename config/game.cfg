// Gameplay defaults. Saved id1/config.cfg values override these on startup.
// Options > Audio: independent effects and dialogue, multiplied by master volume.
effectsvolume 0.75
dialoguevolume 1
// Options > Autosave history: 0 disables. Range 0..16.
aw_autosaves 5
// Modal backgrounds: new default freezes world work and paints black.
// Head/race, journals and blocking overlays, original name entry is unchanged.
// Soundtrack and UI/head animation keep running in every combination.
// Legacy live 3D background: set BOTH aw_modal_freeze 0 and aw_modal_black 0.
// Saved id1/config.cfg settings override these defaults.
aw_modal_freeze 1
aw_modal_black 1
// V2 character panels add a focused/clickable OK button, 1 keeps the old layout.
aw_ui_mode 2
// Compass/heading HUD: disabled by default. Console: dbg compass on/off.
aw_compass 0
// Automatic cell crossings only: seconds before the loading display appears.
// 0 = instantly. 2 = after two seconds (default). Saved on exit in config.cfg.
// Effective range 0..60. Negative/NaN -> 0, values above 60 -> 60.
aw_region_loading_delay 2
// Automatic time passage. dbg daynightcycle off freezes it. Set time/T wait still work.
aw_daynightcycle 1
// Shared exterior sky/fog follow the saved clock. dbg sky off restores their baseline.
aw_daynight 1
// Sky V1 is the Clear reference. V2 is vivid. V3 extra stronk is the default.
aw_sky_type 3
// Independent exterior presentation controls. Both default on.
aw_sun 1
aw_clouds 1
// Owned stars/nebula and complete night layer (including both moons).
aw_starsky 1
aw_nightsky 1
// Clear clouds 00:00..03:00, fade out from 23:00 and return by 04:00.
// Independent of cloud-control V1/V2. dbg nightskymode legacy disables it.
aw_nightsky_mode 1
// Automatic original guard torches. dbg guardtorch on/off/auto overrides for testing.
guards_torch_cycle 1
// Cloud speed as a factor of legacy travel. dbg skyspeed 0 freezes clouds only.
// Default 0.00333333333 is 1/300 speed. 0.01 is the prior rate. 1 restores legacy speed.
aw_skyspeed 0.00333333333

// Universal player + admitted guard light radius, runtime units (32..288).
// Classic base was 144, 192 reaches further. Does not add more point lights.
aw_torch_radius 192
// Original flame artwork with bright base. 1 classic, 3 optional sparks.
aw_torch_flame_style 2
// Local renderer-relative intensity (0..1). 0.7 preserves NPC contribution.
aw_torch_strength 0.7

// Morrowind-style free-look: automatic pitch recentering is off by default.
// Set to 1 to restore legacy forward-walk/lookspring centering. Centerview remains explicit.
aw_auto_center 0

// Keep the held torch/arm depth stable while running, 1 restores legacy depth bob.
// Camera and lateral/vertical motion remain enabled.
aw_torch_depth_bob 0

// Opt-in exact resident LAND beyond fog distance. 0 keeps the prior renderer.
// Native visual/frame-cost acceptance is pending. Console: aw_horizon_stats.
aw_terrain_horizon 0

// Pickup notifications: existing slide animation on. 0 draws immediately.
aw_animate_item_pickups 1

// Optional interior brightness: applies to environment and character static light.
// dbg indoor luma [0..4] queries/sets. 1.0 is baseline. saved values override.
// Menu steps are 1.0-1.5 in tenths. Image staging follows the engine feature flag.
aw_interiorluma 1.2
// Exterior gain is separate. Preserve the original default day/night balance.
aw_exteriorluma 1.0
