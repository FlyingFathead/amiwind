// AmiWind default gameplay bindings. Copy to id1/keymaps.cfg to customize.
// Ctrl flight and Alt+M desktop have an additional runtime debug-mode gate.
unbindall
bind "w" +forward
bind "s" +back
bind "a" +moveleft
bind "d" +moveright
bind "UPARROW" +forward
bind "DOWNARROW" +back
bind "LEFTARROW" +moveleft
bind "RIGHTARROW" +moveright
bind "SPACE" +jump
bind "SHIFT" +speed
bind "ESCAPE" togglemenu
bind "`" toggleconsole
bind "F10" toggleconsole
bind "e" +aw_use
bind "q" +movedown
bind "F6" aw_music_next
bind "F8" aw_music_mode
bind "MOUSE1" +attack
// The Amiga right mouse button arrives as MOUSE3 (the middle button is MOUSE2).
// +aw_alt: block (hold to raise the shield, aw_combat_block 1); picks a companion in pick mode (dbg companion pick).
bind "MOUSE3" +aw_alt
// Toggle POV (the original's default Tab): a short press switches first/third person, held it orbits
// the camera around you; the wheel zooms the third-person camera (docs/THIRD_PERSON.md).
bind "TAB" +aw_pov
bind "MWHEELUP" "aw_view_zoom 1"
bind "MWHEELDOWN" "aw_view_zoom -1"
bind "f" "impulse 202"
bind "v" "aw_torch"
bind "F5" aw_quicksave
bind "F9" aw_quickload
bind "t" aw_wait
bind "F1" aw_quick_help
bind "m" aw_worldmap
bind "j" aw_journal
bind "CTRL" +aw_fastflight
bind "ALT+M" aw_desktop
